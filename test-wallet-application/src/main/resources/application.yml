spring:
  application.name: swiyu-test-wallet
  jackson.default-property-inclusion: NON_NULL

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

application:
  issuer:
    base-image: "${ISSUER_IMAGE_NAME:ghcr.io/swiyu-admin-ch/swiyu-issuer}"
    image-tag: "${ISSUER_IMAGE_TAG:dev}"
    signed-metadata: true
  verifier:
    base-image: "${VERIFIER_IMAGE_NAME:ghcr.io/swiyu-admin-ch/swiyu-verifier}"
    image-tag: "${VERIFIER_IMAGE_TAG:dev}"
  container-logs:
    issuer: "${ISSUER_CONTAINER_LOGS:true}"
    verifier: "${VERIFIER_CONTAINER_LOGS:true}"
    db: "${DB_CONTAINER_LOGS:false}"
    mock-server: "${MOCKSERVER_CONTAINER_LOGS:false}"
    soft-hsm: "${SOFTHSM_CONTAINER_LOGS:false}"
  trace: "${TRACE_TEST_REQUESTS:false}"