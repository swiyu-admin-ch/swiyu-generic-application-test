name: Run E2E Tests HSM (Branches)
run-name: >-
  HSM application-tests=${{ github.ref_name }}
  issuer=${{ inputs.issuer-branch }}
  verifier=${{ inputs.verifier-branch }}

on:
  workflow_dispatch:
    inputs:
      issuer-branch:
        description: 'Issuer branch to build'
        required: true
        type: string
        default: 'main'
      verifier-branch:
        description: 'Verifier branch to build'
        required: true
        type: string
        default: 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    env:
      ISSUER_IMAGE_NAME: swiyu-issuer
      ISSUER_IMAGE_TAG: local
      VERIFIER_IMAGE_NAME: swiyu-verifier
      VERIFIER_IMAGE_TAG: local
      SOFTHSM_CONTAINER_LOGS: 'true'
    steps:
      - name: Checkout application tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout issuer
        uses: actions/checkout@v4
        with:
          repository: swiyu-admin-ch/swiyu-issuer
          ref: ${{ inputs.issuer-branch }}
          path: .component-sources/swiyu-issuer
          persist-credentials: false

      - name: Checkout verifier
        uses: actions/checkout@v4
        with:
          repository: swiyu-admin-ch/swiyu-verifier
          ref: ${{ inputs.verifier-branch }}
          path: .component-sources/swiyu-verifier
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: Build issuer application
        working-directory: .component-sources/swiyu-issuer
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Build issuer Docker image
        working-directory: .component-sources/swiyu-issuer
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg SOURCE_IMAGE=eclipse-temurin:25-jre-ubi10-minimal \
            --tag "${ISSUER_IMAGE_NAME}:${ISSUER_IMAGE_TAG}" \
            .

      - name: Build verifier application
        working-directory: .component-sources/swiyu-verifier
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Build verifier Docker image
        working-directory: .component-sources/swiyu-verifier
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg SOURCE_IMAGE=eclipse-temurin:25-jre-ubi10-minimal \
            --tag "${VERIFIER_IMAGE_NAME}:${VERIFIER_IMAGE_TAG}" \
            .

      - name: Verify images and summarize selected sources
        shell: bash
        env:
          REQUESTED_ISSUER_BRANCH: ${{ inputs.issuer-branch }}
          REQUESTED_VERIFIER_BRANCH: ${{ inputs.verifier-branch }}
        run: |
          set -euo pipefail

          issuer_sha="$(git -C .component-sources/swiyu-issuer rev-parse HEAD)"
          verifier_sha="$(git -C .component-sources/swiyu-verifier rev-parse HEAD)"
          issuer_image_id="$(docker image inspect --format '{{.Id}}' "${ISSUER_IMAGE_NAME}:${ISSUER_IMAGE_TAG}")"
          verifier_image_id="$(docker image inspect --format '{{.Id}}' "${VERIFIER_IMAGE_NAME}:${VERIFIER_IMAGE_TAG}")"

          {
            echo '## HSM E2E component sources'
            echo
            echo '| Component | Requested branch | Resolved SHA | Local image |'
            echo '| --- | --- | --- | --- |'
            printf '| Application tests | `%s` | `%s` | n/a |\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
            printf '| Issuer | `%s` | `%s` | `%s:%s` (`%s`) |\n' \
              "$REQUESTED_ISSUER_BRANCH" "$issuer_sha" "$ISSUER_IMAGE_NAME" "$ISSUER_IMAGE_TAG" "$issuer_image_id"
            printf '| Verifier | `%s` | `%s` | `%s:%s` (`%s`) |\n' \
              "$REQUESTED_VERIFIER_BRANCH" "$verifier_sha" "$VERIFIER_IMAGE_NAME" "$VERIFIER_IMAGE_TAG" "$verifier_image_id"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check local images for SoftHSM compatibility
        shell: bash
        run: |
          set -euo pipefail
          command -v openssl

          inspect_help="$(docker image inspect --help)"
          inspect_image() {
            # Older runner clients do not support platform selection for image inspect.
            if [[ "$inspect_help" == *--platform* ]]; then
              docker image inspect --platform linux/amd64 "$@"
            else
              docker image inspect "$@"
            fi
          }

          check_image() {
            local component="$1" image="$2:$3"
            local platform

            platform="$(inspect_image --format '{{.Os}}/{{.Architecture}}' "$image")"
            if [[ "$platform" != 'linux/amd64' ]]; then
              echo "::error::${component}: SoftHSM requires linux/amd64; found ${platform}."
              return 1
            fi

            if ! docker run --rm --pull=never --platform linux/amd64 \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/test-wallet-library/src/main/resources/softhsm/libs,target=/tmp/softhsm-preflight,readonly" \
              --entrypoint /bin/sh "$image" -ec '
                command -v ldd >/dev/null 2>&1 || {
                  echo "The unhardened image must contain a shell and ldd." >&2
                  exit 1
                }
                dependencies="$(ldd /tmp/softhsm-preflight/libsofthsm2.so 2>&1)" || {
                  printf "%s\n" "$dependencies" >&2
                  exit 1
                }
                printf "%s\n" "$dependencies"
                case "$dependencies" in
                  *"not found"*)
                    echo "Missing SoftHSM native dependencies; libcrypto.so.3 is required." >&2
                    exit 1
                    ;;
                esac
              '; then
              echo "::error::${component}: the built image is not compatible with the bundled SoftHSM library."
              return 1
            fi
          }

          check_image Issuer "$ISSUER_IMAGE_NAME" "$ISSUER_IMAGE_TAG"
          check_image Verifier "$VERIFIER_IMAGE_NAME" "$VERIFIER_IMAGE_TAG"

      - name: Configure Docker Java client API version
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and verify HSM E2E tests with Maven
        id: hsm-tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl test-wallet-application -am clean verify \
            -Dhsm=true \
            -Dtest=IssuerHSMTest,VerifierHSMTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs=true \
            2>&1 | tee "$RUNNER_TEMP/hsm-branch-e2e-maven.log"

      - name: Check that both HSM test classes ran
        if: ${{ !cancelled() && steps.hsm-tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "ch.admin.bj.swiyu.swiyu_test_wallet.issuer.IssuerHSMTest",
              "ch.admin.bj.swiyu.swiyu_test_wallet.verifier.VerifierHSMTest",
          }
          report_dir = Path("test-wallet-application/target/surefire-reports")
          reports = {path.stem.removeprefix("TEST-"): path for path in report_dir.glob("TEST-*.xml")}
          errors = []
          summary = [
              "\n## HSM E2E results\n",
              "| Test class | Tests | Skipped | Failures | Errors |",
              "| --- | --- | --- | --- | --- |",
          ]
          for name in sorted(expected):
              if name not in reports:
                  errors.append(f"Missing HSM test report: {name}")
                  continue
              suite = ET.parse(reports[name]).getroot()
              tests, skipped, failures, test_errors = (
                  int(suite.get(attribute, "0"))
                  for attribute in ("tests", "skipped", "failures", "errors")
              )
              summary.append(f"| {name.rsplit('.', 1)[-1]} | {tests} | {skipped} | {failures} | {test_errors} |")
              if tests - skipped <= 0 or skipped or failures or test_errors:
                  errors.append(f"{name}: HSM tests must run successfully with no skipped tests")
          for name in sorted(reports.keys() - expected):
              errors.append(f"Unexpected test class in the HSM suite: {name}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          for error in errors:
              print(f"::error::{error}")
          raise SystemExit(bool(errors))
          PY

      - name: Publish Test Report
        if: ${{ !cancelled() && steps.hsm-tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v1
        with:
          name: HSM Branch Maven Test Results
          path: 'test-wallet-application/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports and Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsm-branch-e2e-test-reports
          path: |
            test-wallet-application/target/surefire-reports/**
            test-wallet-application/target/TEST-junit-jupiter.xml
            ${{ runner.temp }}/hsm-branch-e2e-maven.log
          if-no-files-found: warn
          retention-days: 30
