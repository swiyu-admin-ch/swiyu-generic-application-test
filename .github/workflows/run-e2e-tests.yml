name: Run E2E Tests
run-name: >-
  E2E application-tests=${{ github.ref_name }}
  issuer=${{ inputs['issuer-mode'] }}:${{ inputs['issuer-ref'] }}
  verifier=${{ inputs['verifier-mode'] }}:${{ inputs['verifier-ref'] }}

on:
  workflow_dispatch:
    inputs:
      issuer-mode:
        description: 'Issuer source mode'
        required: true
        default: image
        type: choice
        options:
          - image
          - branch
          - commit
      issuer-ref:
        description: 'Issuer: image tag, branch name, or full commit SHA'
        required: true
        default: stable
        type: string
      verifier-mode:
        description: 'Verifier source mode'
        required: true
        default: image
        type: choice
        options:
          - image
          - branch
          - commit
      verifier-ref:
        description: 'Verifier: image tag, branch name, or full commit SHA'
        required: true
        default: stable
        type: string

jobs:
  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
      packages: read
    steps:
      - name: Checkout application tests
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Summarize test selection
        shell: bash
        run: |
          {
            echo '## Standard E2E sources and images'
            echo
            printf 'Application tests: `%s` (`%s`)\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
            echo '| Component | Phase | Mode | Requested reference | Source SHA | Image | Image ID | Registry digest |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        if: ${{ inputs['issuer-mode'] == 'image' || inputs['verifier-mode'] == 'image' }}
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Prepare issuer
        id: issuer
        uses: ./.github/actions/prepare-e2e-component
        with:
          component: issuer
          mode: ${{ inputs['issuer-mode'] }}
          ref: ${{ inputs['issuer-ref'] }}

      - name: Prepare verifier
        id: verifier
        uses: ./.github/actions/prepare-e2e-component
        with:
          component: verifier
          mode: ${{ inputs['verifier-mode'] }}
          ref: ${{ inputs['verifier-ref'] }}

      - name: Configure Docker Java client API version
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and verify standard E2E tests with Maven
        shell: bash
        env:
          ISSUER_IMAGE_NAME: ${{ steps.issuer.outputs.image-name }}
          ISSUER_IMAGE_TAG: ${{ steps.issuer.outputs.image-tag }}
          VERIFIER_IMAGE_NAME: ${{ steps.verifier.outputs.image-name }}
          VERIFIER_IMAGE_TAG: ${{ steps.verifier.outputs.image-tag }}
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress clean verify \
            2>&1 | tee "$RUNNER_TEMP/standard-e2e-maven.log"

      - name: Upload Xray JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-junit-${{ github.job }}
          path: test-wallet-application/target/TEST-junit-jupiter.xml
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Standard Maven Test Results
          path: 'test-wallet-*/target/surefire-reports/TEST-*.xml,test-wallet-*/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports and Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standard-test-reports
          path: |
            test-wallet-*/target/surefire-reports/**
            test-wallet-*/target/failsafe-reports/**
            test-wallet-*/target/TEST-junit-jupiter.xml
            ${{ runner.temp }}/standard-e2e-maven.log
          if-no-files-found: warn
          retention-days: 30
