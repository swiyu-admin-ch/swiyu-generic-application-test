name: Run E2E Tests
run-name: >-
  ${{ inputs['test-suite'] }} issuer=${{ inputs['issuer-image-tag'] }}

on:
  workflow_dispatch:
    inputs:
      test-suite:
        description: 'Test suite to run'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - version-regression
      issuer-image-tag:
        description: 'Issuer image tag (standard or regression Candidate)'
        required: true
        default: 'stable'
        type: string
      verifier-image-tag:
        description: 'Verifier image tag (standard or future regression Candidate)'
        required: true
        default: 'stable'
        type: string
      previous-issuer-image-tag:
        description: 'Previous Issuer image tag (required for version-regression)'
        required: false
        type: string
      previous-verifier-image-tag:
        description: 'Previous Verifier image tag (optional until Verifier regressions are implemented)'
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TEST_SUITE: ${{ inputs['test-suite'] }}
      ISSUER_IMAGE_TAG: ${{ inputs['issuer-image-tag'] }}
      VERIFIER_IMAGE_TAG: ${{ inputs['verifier-image-tag'] }}
      REGRESSION_ISSUER_PREVIOUS_VERSION: ${{ inputs['previous-issuer-image-tag'] }}
      REGRESSION_ISSUER_CANDIDATE_VERSION: ${{ inputs['issuer-image-tag'] }}
      REGRESSION_VERIFIER_PREVIOUS_VERSION: ${{ inputs['previous-verifier-image-tag'] }}
      REGRESSION_VERIFIER_CANDIDATE_VERSION: ${{ inputs['verifier-image-tag'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Configure Docker Java client API version
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Validate and summarize test selection
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$TEST_SUITE" == "version-regression" ]]; then
            if [[ -z "$REGRESSION_ISSUER_PREVIOUS_VERSION" ]]; then
              echo "previous-issuer-image-tag is required for version-regression." >&2
              exit 1
            fi
            if [[ "$REGRESSION_ISSUER_PREVIOUS_VERSION" == "$REGRESSION_ISSUER_CANDIDATE_VERSION" ]]; then
              echo "Previous and Candidate Issuer image tags must be different." >&2
              exit 1
            fi
            if [[ -n "$REGRESSION_VERIFIER_PREVIOUS_VERSION" ]] \
              && [[ "$REGRESSION_VERIFIER_PREVIOUS_VERSION" == "$REGRESSION_VERIFIER_CANDIDATE_VERSION" ]]; then
              echo "Previous and Candidate Verifier image tags must be different." >&2
              exit 1
            fi
          fi

          {
            echo "## E2E test selection"
            echo
            echo "- Suite: \`$TEST_SUITE\`"
            if [[ "$TEST_SUITE" == "version-regression" ]]; then
              echo "- Previous Issuer: \`$REGRESSION_ISSUER_PREVIOUS_VERSION\`"
              echo "- Candidate Issuer: \`$REGRESSION_ISSUER_CANDIDATE_VERSION\`"
              if [[ -n "$REGRESSION_VERIFIER_PREVIOUS_VERSION" ]]; then
                echo "- Previous Verifier: \`$REGRESSION_VERIFIER_PREVIOUS_VERSION\`"
                echo "- Candidate Verifier: \`$REGRESSION_VERIFIER_CANDIDATE_VERSION\`"
              fi
            else
              echo "- Issuer: \`$ISSUER_IMAGE_TAG\`"
              echo "- Verifier: \`$VERIFIER_IMAGE_TAG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and verify standard E2E tests with Maven
        if: ${{ inputs['test-suite'] == 'standard' }}
        run: mvn --batch-mode verify

      - name: Build and verify version regression tests with Maven
        if: ${{ inputs['test-suite'] == 'version-regression' }}
        run: mvn --batch-mode -Pversion-regression clean verify

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven Test Results
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs['test-suite'] }}-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
            **/target/TEST-junit-jupiter.xml
          retention-days: 30
