name: Run E2E Tests HSM
run-name: >-
  HSM issuer=${{ inputs['issuer-image-tag'] }}
  verifier=${{ inputs['verifier-image-tag'] }}

on:
  workflow_dispatch:
    inputs:
      issuer-image-name:
        description: 'Unhardened linux/amd64 Issuer image repository (without tag)'
        required: true
        default: 'ghcr.io/swiyu-admin-ch/swiyu-issuer'
        type: string
      issuer-image-tag:
        description: 'Unhardened Issuer image tag'
        required: true
        type: string
      verifier-image-name:
        description: 'Unhardened linux/amd64 Verifier image repository (without tag)'
        required: true
        default: 'ghcr.io/swiyu-admin-ch/swiyu-verifier'
        type: string
      verifier-image-tag:
        description: 'Unhardened Verifier image tag'
        required: true
        type: string

jobs:
  hsm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      packages: read
    env:
      ISSUER_IMAGE_NAME: ${{ inputs['issuer-image-name'] }}
      ISSUER_IMAGE_TAG: ${{ inputs['issuer-image-tag'] }}
      VERIFIER_IMAGE_NAME: ${{ inputs['verifier-image-name'] }}
      VERIFIER_IMAGE_TAG: ${{ inputs['verifier-image-tag'] }}
      SOFTHSM_CONTAINER_LOGS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate image inputs
        shell: bash
        run: |
          set -euo pipefail

          validate_image() {
            local component="$1" image_name="$2" image_tag="$3"
            if [[ ! "$image_name" =~ ^[a-z0-9][a-z0-9./:_-]*$ ]] \
              || [[ "${image_name##*/}" == *:* ]] \
              || [[ ! "$image_tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "::error::${component}: provide an image repository and a separate, non-empty Docker tag."
              return 1
            fi
          }

          validate_image Issuer "$ISSUER_IMAGE_NAME" "$ISSUER_IMAGE_TAG"
          validate_image Verifier "$VERIFIER_IMAGE_NAME" "$VERIFIER_IMAGE_TAG"

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(inputs['issuer-image-name'], 'ghcr.io/') || startsWith(inputs['verifier-image-name'], 'ghcr.io/') }}
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Pull images and check SoftHSM compatibility
        shell: bash
        run: |
          set -euo pipefail
          command -v openssl

          {
            echo '## HSM E2E images'
            echo
            echo '| Component | Image | Digest |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          check_image() {
            local component="$1" image="$2:$3"
            local platform digest

            docker pull --platform linux/amd64 "$image"
            platform="$(docker image inspect --platform linux/amd64 --format '{{.Os}}/{{.Architecture}}' "$image")"
            if [[ "$platform" != 'linux/amd64' ]]; then
              echo "::error::${component}: SoftHSM requires linux/amd64; found ${platform}."
              return 1
            fi

            digest="$(docker image inspect --platform linux/amd64 --format '{{join .RepoDigests ", "}}' "$image")"
            printf '| %s | `%s` | `%s` |\n' "$component" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

            if ! docker run --rm --platform linux/amd64 \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/test-wallet-library/src/main/resources/softhsm/libs,target=/tmp/softhsm-preflight,readonly" \
              --entrypoint /bin/sh "$image" -ec '
                command -v ldd >/dev/null 2>&1 || {
                  echo "The unhardened image must contain a shell and ldd." >&2
                  exit 1
                }
                dependencies="$(ldd /tmp/softhsm-preflight/libsofthsm2.so 2>&1)" || {
                  printf "%s\n" "$dependencies" >&2
                  exit 1
                }
                printf "%s\n" "$dependencies"
                case "$dependencies" in
                  *"not found"*)
                    echo "Missing SoftHSM native dependencies; libcrypto.so.3 is required." >&2
                    exit 1
                    ;;
                esac
              '; then
              echo "::error::${component}: image is not compatible with the bundled SoftHSM library. Use an unhardened linux/amd64 image with its native dependencies."
              return 1
            fi
          }

          check_image Issuer "$ISSUER_IMAGE_NAME" "$ISSUER_IMAGE_TAG"
          check_image Verifier "$VERIFIER_IMAGE_NAME" "$VERIFIER_IMAGE_TAG"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Configure Docker Java client API version
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and verify HSM E2E tests with Maven
        id: hsm-tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl test-wallet-application -am clean verify \
            -Dhsm=true \
            -Dtest=IssuerHSMTest,VerifierHSMTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs=true \
            2>&1 | tee "$RUNNER_TEMP/hsm-e2e-maven.log"

      - name: Check that both HSM test classes ran
        if: ${{ !cancelled() && steps.hsm-tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "ch.admin.bj.swiyu.swiyu_test_wallet.issuer.IssuerHSMTest",
              "ch.admin.bj.swiyu.swiyu_test_wallet.verifier.VerifierHSMTest",
          }
          report_dir = Path("test-wallet-application/target/surefire-reports")
          reports = {path.stem.removeprefix("TEST-"): path for path in report_dir.glob("TEST-*.xml")}
          errors = []
          summary = [
              "\n## HSM E2E results\n",
              "| Test class | Tests | Skipped | Failures | Errors |",
              "| --- | --- | --- | --- | --- |",
          ]
          for name in sorted(expected):
              if name not in reports:
                  errors.append(f"Missing HSM test report: {name}")
                  continue
              suite = ET.parse(reports[name]).getroot()
              tests, skipped, failures, test_errors = (
                  int(suite.get(attribute, "0"))
                  for attribute in ("tests", "skipped", "failures", "errors")
              )
              summary.append(f"| {name.rsplit('.', 1)[-1]} | {tests} | {skipped} | {failures} | {test_errors} |")
              if tests - skipped <= 0 or skipped or failures or test_errors:
                  errors.append(f"{name}: HSM tests must run successfully with no skipped tests")
          for name in sorted(reports.keys() - expected):
              errors.append(f"Unexpected test class in the HSM suite: {name}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          for error in errors:
              print(f"::error::{error}")
          raise SystemExit(bool(errors))
          PY

      - name: Publish Test Report
        if: ${{ !cancelled() && steps.hsm-tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v1
        with:
          name: HSM Maven Test Results
          path: 'test-wallet-application/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports and Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsm-e2e-test-reports
          path: |
            test-wallet-application/target/surefire-reports/**
            test-wallet-application/target/TEST-junit-jupiter.xml
            ${{ runner.temp }}/hsm-e2e-maven.log
          if-no-files-found: warn
          retention-days: 30
