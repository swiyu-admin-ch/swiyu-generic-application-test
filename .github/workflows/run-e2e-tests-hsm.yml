name: Run E2E Tests HSM
run-name: >-
  HSM application-tests=${{ github.ref_name }}
  issuer=${{ inputs['issuer-mode'] }}:${{ inputs['issuer-ref'] }}
  verifier=${{ inputs['verifier-mode'] }}:${{ inputs['verifier-ref'] }}

on:
  workflow_dispatch:
    inputs:
      issuer-mode:
        description: 'Issuer source mode'
        required: true
        default: image
        type: choice
        options:
          - image
          - branch
          - commit
      issuer-ref:
        description: 'Issuer: image tag, branch name, or full commit SHA'
        required: true
        type: string
      verifier-mode:
        description: 'Verifier source mode'
        required: true
        default: image
        type: choice
        options:
          - image
          - branch
          - commit
      verifier-ref:
        description: 'Verifier: image tag, branch name, or full commit SHA'
        required: true
        type: string

jobs:
  hsm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
      packages: read
    env:
      ISSUER_MODE: ${{ inputs['issuer-mode'] }}
      ISSUER_REFERENCE: ${{ inputs['issuer-ref'] }}
      VERIFIER_MODE: ${{ inputs['verifier-mode'] }}
      VERIFIER_REFERENCE: ${{ inputs['verifier-ref'] }}
      ISSUER_SOURCE_SHA: n/a
      VERIFIER_SOURCE_SHA: n/a
      SOFTHSM_CONTAINER_LOGS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate references and select images
        id: selection
        shell: bash
        run: |
          set -euo pipefail

          select_image() {
            local component="$1" prefix="$2" mode="$3" reference="$4"
            local image_name="swiyu-${component}" image_tag=local checkout_ref

            case "$mode" in
              image)
                if [[ ! "$reference" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
                  echo "::error::${component}: image mode requires a Docker tag, without the image repository."
                  return 1
                fi
                image_name="ghcr.io/swiyu-admin-ch/swiyu-${component}"
                image_tag="$reference"
                ;;
              branch)
                checkout_ref="refs/heads/${reference}"
                if ! git check-ref-format "$checkout_ref"; then
                  echo "::error::${component}: branch mode requires a valid branch name."
                  return 1
                fi
                printf '%s-checkout-ref=%s\n' "$component" "$checkout_ref" >> "$GITHUB_OUTPUT"
                ;;
              commit)
                if [[ ! "$reference" =~ ^[a-fA-F0-9]{40}$ ]]; then
                  echo "::error::${component}: commit mode requires a full 40-character commit SHA."
                  return 1
                fi
                checkout_ref="$(printf '%s' "$reference" | tr 'A-F' 'a-f')"
                printf '%s-checkout-ref=%s\n' "$component" "$checkout_ref" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::${component}: mode must be image, branch, or commit."
                return 1
                ;;
            esac

            printf '%s_IMAGE_NAME=%s\n%s_IMAGE_TAG=%s\n' \
              "$prefix" "$image_name" "$prefix" "$image_tag" >> "$GITHUB_ENV"
          }

          select_image issuer ISSUER "$ISSUER_MODE" "$ISSUER_REFERENCE"
          select_image verifier VERIFIER "$VERIFIER_MODE" "$VERIFIER_REFERENCE"

      - name: Checkout issuer
        if: ${{ inputs['issuer-mode'] != 'image' }}
        uses: actions/checkout@v4
        with:
          repository: swiyu-admin-ch/swiyu-issuer
          ref: ${{ steps.selection.outputs.issuer-checkout-ref }}
          path: .component-sources/swiyu-issuer
          persist-credentials: false

      - name: Checkout verifier
        if: ${{ inputs['verifier-mode'] != 'image' }}
        uses: actions/checkout@v4
        with:
          repository: swiyu-admin-ch/swiyu-verifier
          ref: ${{ steps.selection.outputs.verifier-checkout-ref }}
          path: .component-sources/swiyu-verifier
          persist-credentials: false

      - name: Verify selected source commits
        if: ${{ inputs['issuer-mode'] != 'image' || inputs['verifier-mode'] != 'image' }}
        shell: bash
        run: |
          set -euo pipefail

          verify_source() {
            local component="$1" prefix="$2" mode="$3" reference="$4"
            local actual_sha requested_sha

            if [[ "$mode" == image ]]; then
              return 0
            fi

            actual_sha="$(git -C ".component-sources/swiyu-${component}" rev-parse HEAD)"
            if [[ "$mode" == commit ]]; then
              requested_sha="$(printf '%s' "$reference" | tr 'A-F' 'a-f')"
              if [[ "$actual_sha" != "$requested_sha" ]]; then
                echo "::error::${component}: checked-out commit does not match the requested SHA."
                return 1
              fi
            fi
            printf '%s_SOURCE_SHA=%s\n' "$prefix" "$actual_sha" >> "$GITHUB_ENV"
          }

          verify_source issuer ISSUER "$ISSUER_MODE" "$ISSUER_REFERENCE"
          verify_source verifier VERIFIER "$VERIFIER_MODE" "$VERIFIER_REFERENCE"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: Build issuer application
        if: ${{ inputs['issuer-mode'] != 'image' }}
        working-directory: .component-sources/swiyu-issuer
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Build issuer Docker image
        if: ${{ inputs['issuer-mode'] != 'image' }}
        working-directory: .component-sources/swiyu-issuer
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg SOURCE_IMAGE=eclipse-temurin:25-jre-ubi10-minimal \
            --tag "${ISSUER_IMAGE_NAME}:${ISSUER_IMAGE_TAG}" \
            .

      - name: Build verifier application
        if: ${{ inputs['verifier-mode'] != 'image' }}
        working-directory: .component-sources/swiyu-verifier
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Build verifier Docker image
        if: ${{ inputs['verifier-mode'] != 'image' }}
        working-directory: .component-sources/swiyu-verifier
        run: |
          docker build --pull --platform linux/amd64 \
            --build-arg SOURCE_IMAGE=eclipse-temurin:25-jre-ubi10-minimal \
            --tag "${VERIFIER_IMAGE_NAME}:${VERIFIER_IMAGE_TAG}" \
            .

      - name: Log in to GitHub Container Registry
        if: ${{ inputs['issuer-mode'] == 'image' || inputs['verifier-mode'] == 'image' }}
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Pull selected registry images
        if: ${{ inputs['issuer-mode'] == 'image' || inputs['verifier-mode'] == 'image' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ISSUER_MODE" == image ]]; then
            docker pull --platform linux/amd64 "${ISSUER_IMAGE_NAME}:${ISSUER_IMAGE_TAG}"
          fi
          if [[ "$VERIFIER_MODE" == image ]]; then
            docker pull --platform linux/amd64 "${VERIFIER_IMAGE_NAME}:${VERIFIER_IMAGE_TAG}"
          fi

      - name: Summarize selected sources and check SoftHSM compatibility
        shell: bash
        run: |
          set -euo pipefail
          command -v openssl

          inspect_help="$(docker image inspect --help)"
          inspect_image() {
            # Older runner clients do not support platform selection for image inspect.
            if [[ "$inspect_help" == *--platform* ]]; then
              docker image inspect --platform linux/amd64 "$@"
            else
              docker image inspect "$@"
            fi
          }

          {
            echo '## HSM E2E sources and images'
            echo
            printf 'Application tests: `%s` (`%s`)\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
            echo '| Component | Mode | Requested reference | Source SHA | Image | Image ID | Registry digest |'
            echo '| --- | --- | --- | --- | --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          check_image() {
            local component="$1" mode="$2" reference="$3" source_sha="$4" image="$5:$6"
            local platform image_id digest

            platform="$(inspect_image --format '{{.Os}}/{{.Architecture}}' "$image")"
            if [[ "$platform" != 'linux/amd64' ]]; then
              echo "::error::${component}: SoftHSM requires linux/amd64; found ${platform}."
              return 1
            fi

            image_id="$(inspect_image --format '{{.Id}}' "$image")"
            digest="$(inspect_image --format '{{join .RepoDigests ", "}}' "$image")"
            printf '| %s | %s | `%s` | `%s` | `%s` | `%s` | `%s` |\n' \
              "$component" "$mode" "$reference" "$source_sha" "$image" "$image_id" "${digest:-n/a}" \
              >> "$GITHUB_STEP_SUMMARY"

            if ! docker run --rm --pull=never --platform linux/amd64 \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/test-wallet-library/src/main/resources/softhsm/libs,target=/tmp/softhsm-preflight,readonly" \
              --entrypoint /bin/sh "$image" -ec '
                command -v ldd >/dev/null 2>&1 || {
                  echo "The unhardened image must contain a shell and ldd." >&2
                  exit 1
                }
                dependencies="$(ldd /tmp/softhsm-preflight/libsofthsm2.so 2>&1)" || {
                  printf "%s\n" "$dependencies" >&2
                  exit 1
                }
                printf "%s\n" "$dependencies"
                case "$dependencies" in
                  *"not found"*)
                    echo "Missing SoftHSM native dependencies; libcrypto.so.3 is required." >&2
                    exit 1
                    ;;
                esac
              '; then
              echo "::error::${component}: image is not compatible with the bundled SoftHSM library. Use an unhardened linux/amd64 image with its native dependencies."
              return 1
            fi
          }

          check_image Issuer "$ISSUER_MODE" "$ISSUER_REFERENCE" "$ISSUER_SOURCE_SHA" "$ISSUER_IMAGE_NAME" "$ISSUER_IMAGE_TAG"
          check_image Verifier "$VERIFIER_MODE" "$VERIFIER_REFERENCE" "$VERIFIER_SOURCE_SHA" "$VERIFIER_IMAGE_NAME" "$VERIFIER_IMAGE_TAG"

      - name: Configure Docker Java client API version
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Build and verify HSM E2E tests with Maven
        id: hsm-tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            -pl test-wallet-application -am clean verify \
            -Dhsm=true \
            -Dtest=IssuerHSMTest,VerifierHSMTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs=true \
            2>&1 | tee "$RUNNER_TEMP/hsm-e2e-maven.log"

      - name: Check that both HSM test classes ran
        if: ${{ !cancelled() && steps.hsm-tests.outcome != 'skipped' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "ch.admin.bj.swiyu.swiyu_test_wallet.issuer.IssuerHSMTest",
              "ch.admin.bj.swiyu.swiyu_test_wallet.verifier.VerifierHSMTest",
          }
          report_dir = Path("test-wallet-application/target/surefire-reports")
          reports = {path.stem.removeprefix("TEST-"): path for path in report_dir.glob("TEST-*.xml")}
          errors = []
          summary = [
              "\n## HSM E2E results\n",
              "| Test class | Tests | Skipped | Failures | Errors |",
              "| --- | --- | --- | --- | --- |",
          ]
          for name in sorted(expected):
              if name not in reports:
                  errors.append(f"Missing HSM test report: {name}")
                  continue
              suite = ET.parse(reports[name]).getroot()
              tests, skipped, failures, test_errors = (
                  int(suite.get(attribute, "0"))
                  for attribute in ("tests", "skipped", "failures", "errors")
              )
              summary.append(f"| {name.rsplit('.', 1)[-1]} | {tests} | {skipped} | {failures} | {test_errors} |")
              if tests - skipped <= 0 or skipped or failures or test_errors:
                  errors.append(f"{name}: HSM tests must run successfully with no skipped tests")
          for name in sorted(reports.keys() - expected):
              errors.append(f"Unexpected test class in the HSM suite: {name}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          for error in errors:
              print(f"::error::{error}")
          raise SystemExit(bool(errors))
          PY

      - name: Publish Test Report
        if: ${{ !cancelled() && steps.hsm-tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v1
        with:
          name: HSM Maven Test Results
          path: 'test-wallet-application/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports and Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsm-e2e-test-reports
          path: |
            test-wallet-application/target/surefire-reports/**
            test-wallet-application/target/TEST-junit-jupiter.xml
            ${{ runner.temp }}/hsm-e2e-maven.log
          if-no-files-found: warn
          retention-days: 30
