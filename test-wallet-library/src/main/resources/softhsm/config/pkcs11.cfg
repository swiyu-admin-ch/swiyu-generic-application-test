name = SoftHSM
library = /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so
slotListIndex = 0

# Test fixtures only: library 3.2.0 requires an ECPrivateKey exposing the EC parameters.
# These attributes allow SunPKCS11 to expose that interface for the imported keys.
# This configuration does not exercise support for non-exportable private keys.
attributes(import, CKO_PRIVATE_KEY, CKK_EC) = {
    CKA_SENSITIVE = false
    CKA_EXTRACTABLE = true
}
